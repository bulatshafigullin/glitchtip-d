# nginx in front of glitchtip-d.
#
# App side:   TRUST_PROXY=true  BIND_ADDRESS=127.0.0.1  PORT=8000  PUBLIC_URL=https://errors.example.com
# Never expose the app port directly while TRUST_PROXY is on: clients could forge X-Real-IP / X-Forwarded-Proto.

upstream glitchtip {
    server 127.0.0.1:8000;
    keepalive 32;                      # reuse upstream connections (SDKs send many small requests)
}

server {
    listen 80;
    server_name errors.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name errors.example.com;

    ssl_certificate     /etc/letsencrypt/live/errors.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/errors.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Keep in sync with the app's request limit (20 MiB). Larger bodies get 413 from nginx.
    client_max_body_size 20m;

    location / {
        proxy_pass http://glitchtip;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;                      # overwritten, so clients cannot forge it
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Buffer request bodies so slow uploaders do not occupy the app (nginx default, stated on purpose).
        proxy_request_buffering on;

        # Do NOT add CORS headers here: the app answers browser-SDK preflights for the ingest
        # endpoints itself, and duplicated Access-Control-* headers make browsers reject the response.
    }
}
